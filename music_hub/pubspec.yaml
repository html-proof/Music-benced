name: music_hub
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^12.1.3
  dio: ^5.4.0
  just_audio: ^0.9.36
  audio_service: ^0.18.12
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  google_sign_in: ^6.2.2
  firebase_database: ^10.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  animations: ^2.0.8
  glassmorphism: ^3.0.0
  upgrader: ^8.0.0
  url_launcher: ^6.2.2
  flutter_animate: ^4.5.0
  rxdart: ^0.27.7
  get_it: ^7.6.4
  path_provider: ^2.1.2
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
